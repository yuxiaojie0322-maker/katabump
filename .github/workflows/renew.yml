name: Katabump Auto Renew

on:
  schedule:
  - cron: '0 2 */1 * *'  # 每 1 天 UTC 2:00 运行
  workflow_dispatch:     # 支持手动触发

jobs:
  Renew-Katabump:
    runs-on: ubuntu-latest
    permissions:
      actions: write  
      contents: read
    
    steps:
    - uses: actions/checkout@v6
    - name: 📥 拉取私有脚本库
      run: |
        git clone --depth 1 https://x-access-token:${ACTIONS_PAT}@github.com/yuxiaojie0322-maker/my-private-scripts.git /tmp/priv
        cp /tmp/priv/Katabump/scripts/*.py .
        cp /tmp/priv/Katabump/scripts/requirements.txt .
        rm -rf /tmp/priv
      env:
        ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
    - name: ⚙ 设置 Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和 Python 依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙ 设置代理 (sing-box)
      continue-on-error: true
      env:
        NODE_LINK: ${{ secrets.NODE_LINK }}
      run: |
        git clone --depth 1 https://x-access-token:${ACTIONS_PAT}@github.com/yuxiaojie0322-maker/my-private-scripts.git /tmp/priv
        bash /tmp/priv/VPS8/scripts/setup_proxy.sh
        rm -rf /tmp/priv
      env:
        ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}

    - name: 🚀 运行续期脚本
      env:
        KATABUMP_ACCOUNTS: ${{ secrets.KATABUMP_ACCOUNTS }}
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          python3 app.py
        
    - name: 🧹 清理全部工作流运行记录 (不留日志)
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for run_id in $(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
          gh run delete $run_id || true
        done
